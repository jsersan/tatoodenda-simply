<div class="auth-card">
  <h2>Restablecer contraseña</h2>

  <p *ngIf="comprobando">Comprobando el enlace…</p>

  <p *ngIf="!comprobando && !tokenValido" class="error">
    El enlace no es válido o ha caducado. Solicita uno nuevo.
  </p>

  <ng-container *ngIf="!comprobando && tokenValido && !message">
    <input type="password" [(ngModel)]="password"  name="password"  placeholder="Nueva contraseña" />
    <input type="password" [(ngModel)]="password2" name="password2" placeholder="Repite la contraseña" />
    <p *ngIf="error" class="error">{{ error }}</p>
    <button (click)="guardar()" [disabled]="loading">
      {{ loading ? 'Guardando…' : 'Guardar contraseña' }}
    </button>
  </ng-container>

  <p *ngIf="message" class="ok">{{ message }}</p>

  <a *ngIf="!comprobando && !tokenValido" class="back-link" routerLink="/forgot-password">
    Solicitar un enlace nuevo
  </a>
  <a *ngIf="!comprobando && tokenValido" class="back-link" routerLink="/">Volver al inicio</a>
</div>
