<div class="auth-card">
  <h2>Recuperar contraseña</h2>

  <ng-container *ngIf="!done">
    <p>Introduce tu email y te enviaremos un enlace para restablecerla.</p>
    <input type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" />
    <button (click)="enviar()" [disabled]="loading || !email">
      {{ loading ? 'Enviando…' : 'Enviar enlace' }}
    </button>
  </ng-container>

  <p *ngIf="done" class="ok">{{ message }}</p>
</div>
