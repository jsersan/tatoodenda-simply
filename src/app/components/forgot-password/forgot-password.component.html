<div class="auth-card">
  <h2>Recuperar contraseña</h2>

  <ng-container *ngIf="!done">
    <p>Introduce tu email y te enviaremos un enlace para restablecerla.</p>
    <input type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com" />
    <button (click)="enviar()" [disabled]="loading || !email">
      {{ loading ? 'Enviando…' : 'Enviar enlace' }}
    </button>
  </ng-container>

  <p *ngIf="done" class="ok">{{ message }}</p>

  <!-- Solo desarrollo: enlace directo para probar reset-password sin correo -->
  <div *ngIf="devResetLink" class="dev-box">
    <p class="dev-label">🛠️ Modo desarrollo — enlace de prueba (no aparece en producción):</p>
    <a [href]="devResetLink">Abrir restablecimiento de contraseña</a>
  </div>

  <a class="back-link" routerLink="/">Volver al inicio</a>
</div>
